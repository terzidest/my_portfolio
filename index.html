<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Anti-FOUC: set the dark class before first paint. Absence of the
         stored key means "follow the system preference". -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark' || (t === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <!-- TEMPORARY (PR #34): ?fx=no-dots,no-glass,no-ring,no-cta,no-mask or
         ?fx=none switches hero effects off to find what lags in Firefox for
         Android. Remove before merge. -->
    <script>
      (function () {
        var fx = new URLSearchParams(location.search).get('fx');
        if (!fx) return;
        var all = ['no-dots', 'no-glass', 'no-ring', 'no-cta', 'no-mask'];
        var on = fx === 'none' ? all : fx.split(',');
        on.forEach(function (name) {
          if (all.indexOf(name) !== -1) document.documentElement.classList.add('fx-' + name);
        });
        document.documentElement.setAttribute('data-fx', '');
        document.documentElement.style.setProperty('--fx-label', JSON.stringify('fx off: ' + on.join(' ')));
      })();
    </script>
    <meta name="theme-color" content="#f5f7fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070d18" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio of Triantaphilos Terzides — senior frontend engineer in Athens with 7+ years building production React, TypeScript and Next.js applications. Open to remote roles across Europe." />
    <!-- Site-wide social-share tags. Social crawlers don't execute JS, so
         these static defaults are what every shared link shows; per-route
         title/description/canonical are handled in JS by usePageMeta. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Triantaphilos Terzides" />
    <meta property="og:title" content="Triantaphilos Terzides | Senior Frontend Engineer" />
    <meta property="og:description" content="Portfolio of Triantaphilos Terzides — senior frontend engineer in Athens with 7+ years building production React, TypeScript and Next.js applications. Open to remote roles across Europe." />
    <meta property="og:url" content="https://terzidest.com/" />
    <meta property="og:image" content="https://terzidest.com/assets/images/projects/portfolio.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <title>Triantaphilos Terzides | Senior Frontend Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
